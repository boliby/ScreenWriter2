name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test, lint, check licenses, and build the debug APK
        run: ./gradlew check assembleDebug

      - name: Name the APK after the commit
        run: cp app/build/outputs/apk/debug/app-debug.apk "ScreenWriter-dev-${GITHUB_SHA::7}.apk"

      # Uploaded unzipped so it can be installed straight from a phone's browser.
      - uses: actions/upload-artifact@v7
        with:
          path: ScreenWriter-dev-*.apk
          archive: false
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/"
