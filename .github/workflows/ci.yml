name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The golden tests compare against fountain.io's sample scripts, which are
      # copyrighted and not in git.
      - uses: actions/cache@v6
        with:
          path: samples
          key: samples-${{ hashFiles('scripts/samples.sha256') }}

      # Robolectric downloads its Android images into the Maven cache.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Download sample scripts
        run: scripts/fetch-samples.sh

      - name: Test, lint, check licenses, and build the debug APK
        run: ./gradlew check assembleDebug
        env:
          REQUIRE_SAMPLES: "1"

      - name: Name the APK after the commit
        run: cp app/build/outputs/apk/debug/app-debug.apk "ScreenWriter-dev-${GITHUB_SHA::7}.apk"

      # Uploaded unzipped so it can be installed straight from a phone's browser.
      - uses: actions/upload-artifact@v7
        with:
          path: ScreenWriter-dev-*.apk
          archive: false
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/"
